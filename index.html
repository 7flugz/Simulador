function optimize(){const c=S.cfg,ms=M12.filter(m=>m>=c.mi),MULT=[.3,.5,.7,1,1.3,1.6,2,2.5,3];let s0=7;const rg=()=>(s0=(s0*1664525+1013904223)%4294967296)/4294967296,pk=a=>a[Math.floor(rg()*a.length)],clone=s=>JSON.parse(JSON.stringify(s));
 function gen(){const s=emptySc();
  if(rg()<.9){s.p1[0]={n:pk([1,2,3,4,5,6]),h:pk(ms.slice(0,4))};if(rg()<.35)s.p1[1]={n:pk([1,2,3]),h:pk(ms.slice(0,4))}}
  const nn=pk([0,1,1,2,2,3]);for(let i=0;i<nn;i++){const ch=Math.floor(rg()*c.canais.length);s.p2[i]={canal:ch,orc:c.canais[ch].orc*pk(MULT),mes:pk(ms.slice(0,4))}}
  if(rg()<.25){const n=pk([1,1,2]),cats=[];while(cats.length<n){const x=Math.floor(rg()*c.cat.length);if(!cats.includes(x))cats.push(x)}s.p3[0]={d:pk([.05,.08,.1]),cats,mes:pk(ms.slice(0,3)),n:pk([1,2])}}
  return s}
 const pool=[];for(let i=0;i<15000;i++){const s=gen(),r=calc(c,s);if(r.avisos.length)continue;const al=alerts(c,s,r);pool.push({s,r,red:al.filter(a=>a.lv==='r').length})}
 if(!pool.length){S.msg='Não foi encontrada nenhuma combinação válida. Reveja os pressupostos.';return}
 let feas=pool.filter(x=>x.r.resi>0&&x.red===0);if(!feas.length)feas=pool.filter(x=>x.r.resi>0);
 feas.sort((a,b)=>b.r.pct-a.r.pct||b.r.roi-a.r.roi);let bestA=feas[0];
 if(bestA){for(let it=0;it<3500;it++){const s=clone(bestA.s),i=Math.floor(rg()*3);
   if(rg()<.75){const ch=Math.floor(rg()*c.canais.length);s.p2[i]={canal:ch,orc:c.canais[ch].orc*pk(MULT),mes:pk(ms.slice(0,4))}}else s.p2[i]={canal:0,orc:0,mes:9};
   const r=calc(c,s);if(r.avisos.length)continue;const red=alerts(c,s,r).filter(a=>a.lv==='r').length;
   if(r.resi>0&&red===0&&(r.pct>bestA.r.pct+1e-9||(Math.abs(r.pct-bestA.r.pct)<1e-9&&r.roi>bestA.r.roi)))bestA={s,r,red}}}
 let hit=pool.filter(x=>x.r.pct>=1);hit.sort((a,b)=>b.r.resi-a.r.resi||a.red-b.red);const bestB=hit[0];
 const chosen=bestA||{s:emptySc(),r:calc(c,emptySc()),red:0};S.sc=chosen.s;S.tab='res';
 const over=chosen.s.p2.filter(k=>k.orc&&c.canais[k.canal]&&k.orc>c.canais[k.canal].hmax);
 let m=`Otimizador (restrição: resultado incremental > 0, alertas vermelhos minimizados, prioridade a P1/P2): entre ${pool.length} combinações testadas e refinadas, a melhor combinação lucrativa atinge ${pc(chosen.r.pct)} da meta de ${pc(c.cresc,0)}, com resultado incremental de ${eur(chosen.r.resi)} e ROI de ${chosen.r.roi.toFixed(2).replace('.',',')}${chosen.red?', mas ainda com '+chosen.red+' alerta(s) vermelho(s)':', sem alertas vermelhos'}.`;
 if(chosen.r.pct<.995){
  m+=` Com esta empresa, o histórico não sustenta lucro suficiente em 12 meses para fechar sozinho o desvio de ${eur(chosen.r.B?chosen.r.B.desvio:0)}: quase todas as alavancas testadas (comerciais, feiras, promoções) custam mais no primeiro ano do que rendem.`;
  if(bestB)m+=` Se preferirem garantir os ${pc(c.cresc,0)} de crescimento aceitando prejuízo, a melhor combinação testada custaria ${eur(-bestB.r.resi)} em resultado incremental${bestB.red?' e ainda deixaria '+bestB.red+' alerta(s) vermelho(s)':''}.`;
 }
 if(over.length)m+=` Atenção: ${over.length} campanha(s) sugerida(s) tem orçamento acima do máximo já investido historicamente nesse canal — é uma extrapolação, não um valor testado.`;
 m+=' Reveja os pressupostos antes de decidir.';S.msg=m}

1. Criar um projeto em https://console.firebase.google.com
2. Authentication > Sign-in method > ativar "Email/Password".
3. Firestore Database > criar base de dados (modo producao).
4. Firestore Database > Regras > colar o conteudo de firestore.rules (fornecido em separado) > Publicar.
5. Definicoes do projeto > As suas aplicacoes > Web (</>) > copiar o objeto firebaseConfig para o topo deste ficheiro.
6. No codigo, mudar a constante SUPER_ADMIN_EMAIL para o email que vai usar como Super Admin.
7. Publicar o ficheiro e, na app publicada, registar uma conta com esse mesmo email: o proprio codigo promove-a automaticamente a Super Admin ativo na primeira vez que inicia sessao.
Utilizadores e cenarios guardados na nuvem (Firestore), partilhados entre dispositivos. Autorizacao imposta tambem pelas Regras de Seguranca do Firestore, nao so pela interface.
